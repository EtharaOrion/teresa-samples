<svg width="1760" height="532" viewBox="0 0 1760 532" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Teresa — read-only code comprehension and scored execution traces">
  <title>Teresa — read-only code comprehension and scored execution traces</title>
  <desc>Editorial ink, teal and gold hero graphic. Curved execution-trace lines converge from the lower field into a faceted gold gem at right, evoking traces crystallizing into a scored outcome, beside a large serif "TERESA" wordmark.</desc>
